<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  #wrap { position: relative; font-family: -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif; }
  svg { display: block; width: 100%; touch-action: none; user-select: none; }
  #wrap.panning svg { cursor: grabbing; }
  #wrap.dragging svg { cursor: grabbing; }
  /* Il punto si afferra: e' la mano che dice che si puo' spostare, prima
     che qualcuno provi a spostarlo. */
  .node { cursor: grab; }
  .board-text { pointer-events: none; }
  .trash { cursor: pointer; }

  /* La scheda esce dal disegno e diventa un cartellino che compare sotto il
     dito. Sulla lavagna resta la forma del set; i numeri arrivano quando si
     guarda un brano, che è quando servono. */
  #tip {
    position: absolute; pointer-events: none; opacity: 0;
    transition: opacity .12s ease; transform: translate(-50%, -100%);
    min-width: 170px; max-width: 280px; padding: 10px 12px 11px;
    border-radius: 12px; border: 1px solid var(--edge);
    background: var(--card); color: var(--ink);
    box-shadow: 0 10px 26px var(--shade);
    font-size: 11px; line-height: 1.35; z-index: 3;
  }
  #tip.on { opacity: 1; }
  #tip .head { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  #tip .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  #tip .pos { font-size: 10px; font-weight: 700; opacity: .5; }
  #tip .title { font-size: 12px; font-weight: 700; margin-bottom: 2px;
                word-break: break-word; }
  #tip .tags { margin-bottom: 8px; }
  #tip .tag { display: flex; gap: 6px; align-items: baseline; margin-top: 3px; }
  #tip .tag .k { flex: 0 0 30px; font-size: 8.5px; text-transform: uppercase;
                 letter-spacing: .04em; opacity: .55; }
  #tip .tag .v { flex: 1; font-size: 10px; opacity: .72; }
  #tip .rows { display: flex; gap: 6px; }
  #tip .cell { flex: 1; text-align: center; border-radius: 8px;
               padding: 4px 2px 5px; background: var(--chip); }
  #tip .cell .k { font-size: 8.5px; text-transform: uppercase;
                  letter-spacing: .04em; opacity: .55; }
  #tip .cell .v { font-size: 12px; font-weight: 700; }
  #tip .cell .d { font-size: 9.5px; font-weight: 700; }

  #zoom {
    position: absolute; right: 10px; top: 10px;
    display: flex; gap: 5px; z-index: 2;
  }
  #zoom button {
    width: 26px; height: 26px; padding: 0; line-height: 1;
    border-radius: 8px; cursor: pointer; font-size: 13px;
    border: 1px solid var(--edge); background: var(--card); color: var(--ink);
    transition: background .12s ease;
  }
  #zoom button:hover { background: var(--edge); }
  /* A tutto schermo il riquadro non è più alto quanto la sua proporzione ma
     quanto lo schermo, e la lavagna ci si adagia dentro senza deformarsi. */
  #wrap:fullscreen { display: flex; align-items: center; justify-content: center; }
  #wrap:fullscreen svg { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="board"></svg>
  <div id="tip"></div>
  <div id="zoom">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zfit" title="Fit the whole set">⤢</button>
    <button id="zfull" title="Full screen">⛶</button>
  </div>
</div>
<script>
(function () {
  "use strict";

  var W = 1100, H = 420;
  // Un brano è un punto sulla linea, non una scheda. Le schede dicevano
  // tutto di ognuno e per questo non lasciavano vedere il set: dieci
  // riquadri da centocinquanta pixel riempiono la lavagna, e la forma —
  // che è ciò per cui la lavagna esiste — spariva dietro i dettagli. I
  // dettagli ora stanno nel cartellino, che compare quando si guarda un
  // brano; e trenta punti ci stanno dove dieci schede non ci stavano.
  var R = 11, R_SEL = 15;
  var LANE = 46;
  var PAD_TOP = 46, PAD_BOTTOM = 62, GUTTER = 66;
  var MIN_Z = 0.22, MAX_Z = 3.2;

  var svg = document.getElementById("board");
  var wrap = document.getElementById("wrap");
  var tip = document.getElementById("tip");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  // La mappina in basso a destra: dove sta ogni punto su tutta la lavagna, e
  // il rettangolo di quanto se ne sta guardando. Serve appena si zooma, che è
  // il momento in cui si perde il resto di vista.
  var MAP_W = 170, MAP_H = 54;
  var MAP_X = W - MAP_W - 12, MAP_Y = H - MAP_H - 12;

  var state = { nodes: [], ticks: [], selected: null, dark: false };
  var view = { z: 1, tx: 0, ty: 0 };
  var pan = null;      // trascinamento dello sfondo
  var roaming = false; // trascinamento dentro la mappina
  var drag = null;     // un punto preso e portato lungo la fila
  var pending = null;  // un render arrivato a gesto in corso
  var fittedFor = null;
  var scene = null, minimap = null, skin = null;

  // `isStreamlitMessage` non è decorazione: Streamlit scarta senza guardare
  // ogni messaggio che non ce l'ha. Senza, il riquadro resta alto zero e non
  // gli arriva mai il primo render, perché non è mai risultato pronto.
  function toParent(msg) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true }, msg), "*");
  }

  // L'altezza da chiedere è quella che il disegno occupa DAVVERO, non quella
  // del viewBox. L'SVG è largo quanto la colonna e tiene la sua proporzione,
  // quindi sotto i millecento pixel è più basso — chiederne 420 lascia una
  // fascia vuota sotto la lavagna. Si misura dopo che il browser ha
  // impaginato.
  function setHeight() {
    if (document.fullscreenElement) return;   // lì l'altezza è lo schermo
    var drawn = Math.round(svg.getBoundingClientRect().height);
    toParent({ type: "streamlit:setFrameHeight", height: (drawn || H) + 12 });
  }

  // Ogni evento porta l'istante in cui è successo. Streamlit ridà a Python
  // l'ultimo valore del componente a OGNI rerun, non solo quando cambia: un
  // click senza un modo di riconoscerlo come già visto verrebbe rieseguito
  // per sempre, perché la risposta a un click è un rerun. Il momento serve
  // e non un contatore, perché il riquadro può essere ricreato da capo e un
  // contatore ripartirebbe da zero.
  function sendValue(value) {
    value.at = Date.now();
    toParent({ type: "streamlit:setComponentValue", value: value, dataType: "json" });
  }

  function svgPoint(evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    var ctm = svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    return pt.matrixTransform(ctm.inverse());
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // Il punto dell'evento nelle coordinate della SCENA, cioe' al netto dello
  // zoom e dello spostamento: e' li' che vivono le corsie.
  function sceneAt(evt) {
    var p = svgPoint(evt);
    return { x: (p.x - view.tx) / view.z, y: (p.y - view.ty) / view.z };
  }

  // In quale corsia cade una x. E' l'inversa di `spot`, e non e' un dettaglio
  // che sia esattamente l'inversa: il punto va dove lo si vede andare.
  function slotAt(x) {
    return clamp(Math.round((x - GUTTER) / LANE - 0.5),
                 0, state.nodes.length - 1);
  }

  function indexOf(id) {
    for (var i = 0; i < state.nodes.length; i++) {
      if (state.nodes[i].id === id) return i;
    }
    return -1;
  }

  function el(tag, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function text(str, attrs) {
    var t = el("text", Object.assign({ class: "board-text" }, attrs));
    t.textContent = str == null ? "" : String(str);
    return t;
  }

  // -- geometria ---------------------------------------------------------

  // La lavagna è larga quanto il set lo richiede. Non si comprime la fila
  // per farla stare nel riquadro: per guardare tutto c'è lo zoom, che parte
  // già aperto sul set intero.
  function boardWidth() {
    return Math.max(W, GUTTER + state.nodes.length * LANE + GUTTER);
  }

  // Il posto di un brano: l'ordine decide la x, la misura la y. Nessuna
  // eccezione — è questo che rende la figura leggibile come un grafico.
  function spot(i) {
    var n = state.nodes[i];
    var h = (n.height === null || n.height === undefined) ? 0.5 : n.height;
    return { x: GUTTER + (i + 0.5) * LANE,
             y: PAD_TOP + (H - PAD_TOP - PAD_BOTTOM) * (1 - h) };
  }

  // Un nastro solo che passa per tutti i punti, invece di un arco per
  // coppia: la scaletta è una linea sola, e vederla intera è metà del motivo
  // per cui si guarda la lavagna. Catmull-Rom convertita in Bézier — passa
  // PER i punti, mentre una spline qualunque ci passerebbe accanto.
  // La stessa curva chiusa in basso: è il riempimento che la fa leggere
  // come un'onda invece che come una spezzata. Senza, la linea dice le
  // stesse cose ma sembra un grafico di borsa.
  function wave() {
    var d = ribbon();
    if (!d) return "";
    var first = spot(0), last = spot(state.nodes.length - 1);
    var floor = H - PAD_BOTTOM + 26;
    return d + " L " + last.x + " " + floor + " L " + first.x + " " + floor + " Z";
  }

  function ribbon() {
    if (state.nodes.length < 2) return "";
    var p = state.nodes.map(function (_, i) { return spot(i); });
    var d = "M " + p[0].x + " " + p[0].y;
    for (var i = 0; i < p.length - 1; i++) {
      var p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p[i + 1];
      d += " C " + (p1.x + (p2.x - p0.x) / 6) + " " + (p1.y + (p2.y - p0.y) / 6) +
           ", " + (p2.x - (p3.x - p1.x) / 6) + " " + (p2.y - (p3.y - p1.y) / 6) +
           ", " + p2.x + " " + p2.y;
    }
    return d;
  }

  // Il punto in mano segue il dito lungo la fila, e SOLO lungo la fila: la
  // sua altezza resta quella che gli da' la misura. E' la ragione per cui
  // questo trascinamento e' lecito dove quello libero non lo era — la x e'
  // gia' l'ordine, quindi tirarla e' cambiare l'ordine; la y direbbe una
  // misura che nessuno ha cambiato.
  function applyDrag() {
    if (!drag || !drag.group) return;
    drag.group.setAttribute(
      "transform", "translate(" + drag.x + "," + spot(drag.index).y + ")");
  }

  function applyView() {
    if (scene) {
      scene.setAttribute("transform",
        "translate(" + view.tx + "," + view.ty + ") scale(" + view.z + ")");
    }
    drawMinimap();
  }

  // Quale porzione della lavagna sta nel riquadro, in frazioni di lavagna.
  function seen() {
    var bw = boardWidth();
    return { x0: -view.tx / (view.z * bw), x1: (W - view.tx) / (view.z * bw),
             y0: -view.ty / (view.z * H), y1: (H - view.ty) / (view.z * H) };
  }

  function centreOn(nx, ny) {
    view.tx = W / 2 - view.z * nx * boardWidth();
    view.ty = H / 2 - view.z * ny * H;
    applyView();
  }

  // Tutto il set nel riquadro. È la vista che ha senso all'apertura: la
  // forma prima, i dettagli con lo zoom.
  function fitAll() {
    var bw = boardWidth();
    view.z = clamp(W / bw, MIN_Z, 1);
    view.tx = (W - view.z * bw) / 2;
    view.ty = (H - view.z * H) / 2;
    applyView();
  }

  function drawMinimap() {
    if (!minimap || !skin) return;
    while (minimap.firstChild) minimap.removeChild(minimap.firstChild);
    // Serve solo quando non si vede già tutto.
    var box = seen();
    if (box.x0 <= 0.001 && box.x1 >= 0.999) return;

    minimap.appendChild(el("rect", {
      x: MAP_X, y: MAP_Y, width: MAP_W, height: MAP_H, rx: 8,
      fill: skin.card, "fill-opacity": 0.95,
      stroke: skin.ink, "stroke-opacity": 0.18 }));

    var x0 = clamp(box.x0, 0, 1), x1 = clamp(box.x1, 0, 1);
    var y0 = clamp(box.y0, 0, 1), y1 = clamp(box.y1, 0, 1);
    minimap.appendChild(el("rect", {
      x: MAP_X + x0 * MAP_W, y: MAP_Y + y0 * MAP_H,
      width: Math.max(3, (x1 - x0) * MAP_W),
      height: Math.max(3, (y1 - y0) * MAP_H),
      fill: skin.ink, "fill-opacity": 0.08,
      stroke: skin.ink, "stroke-opacity": 0.45, rx: 3 }));

    var bw = boardWidth();
    state.nodes.forEach(function (n, i) {
      var s = spot(i);
      minimap.appendChild(el("circle", {
        cx: MAP_X + (s.x / bw) * MAP_W, cy: MAP_Y + (s.y / H) * MAP_H,
        r: n.id === state.selected ? 2.6 : 1.8, fill: warm(n.height),
        "fill-opacity": n.id === state.selected ? 1 : 0.75 }));
    });
  }

  // -- il cartellino -----------------------------------------------------

  function cell(key, value, shift) {
    var d = shift ? '<div class="d" style="color:' + wayInk(shift[1]) + '">'
                    + escape_(shift[0]) + '</div>' : '<div class="d">&nbsp;</div>';
    return '<div class="cell"><div class="k">' + key + '</div><div class="v">'
           + escape_(value) + '</div>' + d + '</div>';
  }

  // Una riga di tag: la parolina a sinistra dice di che tag si tratta, o le
  // due file di nomi si leggerebbero come una sola.
  function tag(key, value) {
    return '<div class="tag"><div class="k">' + key + '</div><div class="v">'
           + escape_(value) + '</div></div>';
  }

  function escape_(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function showTip(i, group) {
    if (drag) return;   // col punto in mano il cartellino e' solo un ostacolo
    var n = state.nodes[i];
    var shift = n.shift || {};
    var tags = "";
    if (n.genres) tags += tag("genre", n.genres);
    if (n.mood) tags += tag("mood", n.mood);
    var cells = "";
    if (n.bpm) cells += cell("bpm", n.bpm, shift.bpm);
    if (n.camelot) cells += cell("key", n.camelot, shift.key);
    if (n.dance) cells += cell("groove", n.dance, shift.dance);
    tip.innerHTML =
      '<div class="head"><span class="dot" style="background:' + escape_(n.color)
      + '"></span><span class="pos">#' + escape_(n.n) + '</span></div>'
      + '<div class="title">' + escape_(n.label) + '</div>'
      + (tags ? '<div class="tags">' + tags + '</div>' : "")
      + (cells ? '<div class="rows">' + cells + '</div>' : "");

    // Dal punto sullo schermo, non dalla scena: fra le due ci sono lo zoom,
    // lo spostamento e quanto il browser ha rimpicciolito l'SVG per farlo
    // stare nella colonna.
    var box = group.getBoundingClientRect();
    var host = wrap.getBoundingClientRect();
    var x = box.left - host.left + box.width / 2;
    var top = box.top - host.top;

    // Il riquadro del componente taglia quello che ne esce, quindi il
    // cartellino non può stare "sempre sopra": sul primo punto in alto — che
    // è il più alto del set, cioè uno di quelli che si guardano — resterebbe
    // mezzo fuori. Si mette sotto quando sopra non ci sta, e si tiene dentro
    // i bordi laterali.
    tip.classList.add("on");
    var high = tip.offsetHeight, wide = tip.offsetWidth;
    var below = top < high + 14;
    tip.style.transform = below ? "translate(-50%, 0)" : "translate(-50%, -100%)";
    tip.style.top = (below ? top + box.height + 10 : top - 10) + "px";
    tip.style.left = clamp(x, wide / 2 + 6, host.width - wide / 2 - 6) + "px";
  }

  function hideTip() { tip.classList.remove("on"); }

  // -- disegno -----------------------------------------------------------

  // Che inchiostro regge su questo fondo. Le tinte dei generi arrivano da una
  // tavolozza fatta per dei puntini, non per scriverci sopra: sceglierlo a
  // occhio vorrebbe dire un numero illeggibile ogni tanto.
  function readable(hex) {
    var m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
    if (!m) return "#1b1f27";
    var v = parseInt(m[1], 16);
    var lum = (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255)
               + 0.114 * (v & 255)) / 255;
    return lum > 0.62 ? "rgba(20,24,31,0.9)" : "rgba(255,255,255,0.95)";
  }

  function drawNode(i, sel) {
    var n = state.nodes[i];
    var s = spot(i);
    var g = el("g", { class: "node", "data-id": n.id,
                      transform: "translate(" + s.x + "," + s.y + ")" });
    var r = sel ? R_SEL : R;

    // Un alone del colore del GENERE sotto il punto: da lontano è quello che
    // fa vedere dove il set cambia colore, cioè dove cambia musica. Il punto
    // sopra è invece caldo come l'onda, quindi l'alone è rimasto solo a
    // dirlo e vuole un filo di opacità in più.
    var glow = warm(n.height);
    g.appendChild(el("circle", { r: r + 7, fill: n.color, "fill-opacity": 0.22 }));
    if (sel) {
      g.appendChild(el("circle", { r: r + 4, fill: "none", stroke: skin.ink,
                                   "stroke-opacity": 0.6, "stroke-width": 1.4 }));
    }
    g.appendChild(el("circle", { r: r, fill: glow, stroke: skin.paper,
                                 "stroke-width": 2, filter: "url(#resting)" }));
    // Il numero d'ordine dentro il punto: davanti a una fila la prima
    // domanda è "questo quando suona".
    g.appendChild(text(n.n, { x: 0, y: sel ? 4.5 : 3.5, "text-anchor": "middle",
                              "font-size": sel ? 12 : 10, "font-weight": 700,
                              fill: readable(glow) }));

    if (sel) {
      // Il titolo del solo selezionato, sotto il punto: uno per volta si
      // legge, tutti insieme sarebbero una siepe di testo sovrapposto.
      g.appendChild(text(n.label, { x: 0, y: r + 20, "text-anchor": "middle",
                                    "font-size": 10.5, "font-weight": 700,
                                    fill: skin.ink }));
      // Sentire e togliere, i due gesti che si fanno su un brano scelto.
      // Il ▶ manda al lettore in fondo alla pagina, che è lo stesso di ogni
      // tabella: un solo posto dove suona la musica, dovunque lo si chieda.
      g.appendChild(button("play", -15, r + 40, n.id));
      g.appendChild(button("remove", 15, r + 40, n.id));
    }

    g.addEventListener("pointerenter", function () { showTip(i, g); });
    g.addEventListener("pointerleave", hideTip);
    // Premere prende il punto e basta. Cosa voleva dire il gesto si sa al
    // rilascio: fermo era un click, spostato era un cambio d'ordine. Deciderlo
    // qui vorrebbe dire mandare un click a ogni trascinamento.
    g.addEventListener("pointerdown", function (evt) {
      evt.stopPropagation();
      hideTip();
      var at = indexOf(n.id);
      if (at < 0) return;
      drag = { id: n.id, index: at, from: at, x: spot(at).x,
               grab: sceneAt(evt).x - spot(at).x,
               clientX: evt.clientX, moved: false, group: null };
      svg.setPointerCapture(evt.pointerId);
      wrap.classList.add("dragging");
      render();   // il punto preso passa sopra ai vicini che sfiora
    });
    return g;
  }

  // Un tondo cliccabile sotto il punto selezionato.
  function button(kind, dx, dy, id) {
    var g = el("g", { class: "trash",
                      transform: "translate(" + dx + "," + dy + ")" });
    g.appendChild(el("circle", { r: 11, fill: skin.card, stroke: skin.ink,
                                 "stroke-opacity": 0.3 }));
    if (kind === "play") {
      g.appendChild(el("path", { d: "M -2.6 -4.2 L 4.4 0 L -2.6 4.2 Z",
                                 fill: skin.ink, "fill-opacity": 0.75 }));
    } else {
      g.appendChild(el("path", {
        d: "M -4 -3 H 4 M -3 -3 V 4 H 3 V -3 M -1.5 -3 V -5 H 1.5 V -3",
        fill: "none", stroke: skin.danger, "stroke-width": 1.3,
        "stroke-linecap": "round", "stroke-linejoin": "round" }));
    }
    g.addEventListener("pointerdown", function (evt) {
      evt.stopPropagation();
      sendValue({ type: kind, id: id });
    });
    return g;
  }

  function skinOf() {
    return state.dark
      ? { ink: "#eef1f6", dim: "rgba(238,241,246,0.55)", paper: "#0e1117",
          card: "#1b1f27", chip: "rgba(238,241,246,0.09)",
          faint: "rgba(238,241,246,0.14)", danger: "#e0503b",
          shadow: "#000000", shade: "rgba(0,0,0,0.55)", rest: 0.45,
          // L'onda calda vuole più corpo dell'ombra grigia che c'era prima:
          // l'arancio a bassa opacità sul nero sparisce, dove il bianco no.
          swell: 0.34,
          // Caldo sale, freddo scende. Non verde e rosso: salire non è
          // giusto e scendere non è un errore — un set fa entrambe le cose.
          rise: "#e0a260", fall: "#7fb4e0" }
      : { ink: "#1b1f27", dim: "rgba(27,31,39,0.55)", paper: "#ffffff",
          card: "#ffffff", chip: "rgba(27,31,39,0.06)",
          faint: "rgba(27,31,39,0.12)", danger: "#c0392b",
          shadow: "#1b1f27", shade: "rgba(27,31,39,0.18)", rest: 0.2,
          swell: 0.28,
          rise: "#a8600f", fall: "#25689e" };
  }

  // La sfumatura calda dell'onda: arancio bruciato in basso, giallo in cima.
  // Dice la stessa cosa dell'altezza — che è la misura scelta — ma la dice a
  // colpo d'occhio e senza passare dalla scala a sinistra; e da lontano fa
  // dell'onda una cosa sola, invece di una fila di pallini di dodici colori.
  //
  // Il genere non se ne va: resta l'alone sotto al punto, che è sempre stato
  // il segnale da lontano di "qui cambia musica", e sta scritto per esteso
  // sulla scheda che compare passandoci sopra.
  var WARM_LOW = [214, 106, 44], WARM_HIGH = [246, 210, 110];

  function warm(height) {
    var h = clamp(height == null ? 0.5 : height, 0, 1);
    var c = WARM_LOW.map(function (v, i) {
      return Math.round(v + (WARM_HIGH[i] - v) * h);
    });
    return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
  }

  function wayInk(way) {
    return way > 0 ? skin.rise : (way < 0 ? skin.fall : skin.dim);
  }

  // Le tacche della misura, con la loro riga: senza, l'altezza è una forma
  // senza unità e la didascalia sotto deve dire a parole ciò che il disegno
  // può scrivere da sé.
  function drawScale() {
    var g = el("g", {});
    var room = H - PAD_TOP - PAD_BOTTOM;
    var wide = boardWidth();
    state.ticks.forEach(function (t) {
      var y = PAD_TOP + room * (1 - t.at);
      g.appendChild(el("line", { x1: GUTTER - 26, y1: y, x2: wide, y2: y,
                                 stroke: skin.ink, "stroke-opacity": 0.12,
                                 "stroke-width": 1, "stroke-dasharray": "1 7",
                                 "stroke-linecap": "round" }));
      g.appendChild(text(t.label, { x: GUTTER - 32, y: y + 3.5,
                                    "text-anchor": "end", "font-size": 9.5,
                                    "font-weight": 600, fill: skin.ink,
                                    "fill-opacity": 0.45 }));
    });
    return g;
  }

  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    hideTip();
    skin = skinOf();
    // A tutto schermo il riquadro deborda dalla lavagna: senza un fondo suo
    // resterebbe il bianco del browser attorno.
    wrap.style.background = skin.paper;
    wrap.style.setProperty("--ink", skin.ink);
    wrap.style.setProperty("--card", skin.card);
    wrap.style.setProperty("--chip", skin.chip);
    wrap.style.setProperty("--edge", skin.faint);
    wrap.style.setProperty("--shade", skin.shade);

    var defs = el("defs", {});
    var f = el("filter", { id: "resting", x: "-60%", y: "-60%",
                           width: "220%", height: "220%" });
    f.appendChild(el("feDropShadow", { dx: 0, dy: 1.5, stdDeviation: 2,
                                       "flood-color": skin.shadow,
                                       "flood-opacity": skin.rest }));
    defs.appendChild(f);
    // Tre fermate e non due: il giallo sta dove passa la cresta, l'arancio
    // sotto, e il fondo si spegne. Con due sole il colore in mezzo sarebbe
    // una media dei due e la sfumatura non si vedrebbe.
    var swell = el("linearGradient", { id: "swell", x1: 0, y1: 0, x2: 0, y2: 1 });
    swell.appendChild(el("stop", { offset: "0%", "stop-color": warm(1),
                                   "stop-opacity": skin.swell }));
    swell.appendChild(el("stop", { offset: "55%", "stop-color": warm(0),
                                   "stop-opacity": skin.swell * 0.55 }));
    swell.appendChild(el("stop", { offset: "100%", "stop-color": warm(0),
                                   "stop-opacity": 0 }));
    defs.appendChild(swell);
    svg.appendChild(defs);
    svg.appendChild(el("rect", { x: 0, y: 0, width: W, height: H,
                                 fill: skin.paper }));

    scene = el("g", {});
    scene.appendChild(drawScale());

    // Il nastro passa DIETRO i punti: è il filo che li tiene insieme, non un
    // tratto da leggere.
    if (state.nodes.length > 1) {
      scene.appendChild(el("path", { d: wave(), fill: "url(#swell)",
                                     stroke: "none" }));
      scene.appendChild(el("path", { d: ribbon(), fill: "none",
                                     stroke: skin.ink, "stroke-opacity": 0.55,
                                     "stroke-width": 2,
                                     "stroke-linecap": "round",
                                     "stroke-linejoin": "round" }));
    }

    // Il selezionato per ultimo, così sta sopra ai vicini che sfiora; e il
    // punto in mano dopo di lui, perché è quello che si sta guardando.
    var chosen = indexOf(state.selected);
    var held = drag ? drag.index : -1;
    state.nodes.forEach(function (n, i) {
      if (i === chosen || i === held) return;
      scene.appendChild(drawNode(i, false));
    });
    if (chosen >= 0 && chosen !== held) scene.appendChild(drawNode(chosen, true));
    if (held >= 0) {
      drag.group = drawNode(held, held === chosen);
      scene.appendChild(drag.group);
    }

    svg.appendChild(scene);
    applyDrag();

    // Fuori dalla scena: la mappina non si sposta né si ingrandisce con
    // quello che racconta.
    minimap = el("g", { id: "minimap" });
    svg.appendChild(minimap);

    // Si riapre sul set intero quando il set cambia lunghezza, non a ogni
    // giro: chi ha zoomato su un passaggio non se lo vede portare via da un
    // click su un punto.
    if (fittedFor !== state.nodes.length) {
      fittedFor = state.nodes.length;
      fitAll();
    } else {
      applyView();
    }
  }

  // -- mouse -------------------------------------------------------------

  function inMinimap(evt) {
    var p = svgPoint(evt);
    return p.x >= MAP_X && p.x <= MAP_X + MAP_W
        && p.y >= MAP_Y && p.y <= MAP_Y + MAP_H;
  }

  function roamTo(evt) {
    var p = svgPoint(evt);
    centreOn(clamp((p.x - MAP_X) / MAP_W, 0, 1),
             clamp((p.y - MAP_Y) / MAP_H, 0, 1));
  }

  svg.addEventListener("pointerdown", function (evt) {
    hideTip();
    // Premere sulla mappina porta lo sguardo lì invece di trascinare la
    // lavagna sotto: è una cartina, non una parte del foglio.
    if (inMinimap(evt) && minimap && minimap.firstChild) {
      roaming = true;
      svg.setPointerCapture(evt.pointerId);
      roamTo(evt);
      return;
    }
    pan = { x: evt.clientX, y: evt.clientY, tx: view.tx, ty: view.ty };
    wrap.classList.add("panning");
    svg.setPointerCapture(evt.pointerId);
  });

  svg.addEventListener("pointermove", function (evt) {
    if (drag) {
      // Fermo entro qualche pixel DELLO SCHERMO, non della scena: a lavagna
      // rimpicciolita dallo zoom la stessa distanza in unità di scena sarebbe
      // meno di un pixel, e ogni click diventerebbe uno spostamento.
      if (Math.abs(evt.clientX - drag.clientX) > 4) drag.moved = true;
      drag.x = sceneAt(evt).x - drag.grab;
      var want = slotAt(drag.x);
      if (want !== drag.index) {
        // La fila si riordina sotto il dito e i numeri seguono: quello che si
        // vede mentre si sposta è già la scaletta che si otterrà.
        state.nodes.splice(want, 0, state.nodes.splice(drag.index, 1)[0]);
        state.nodes.forEach(function (n, i) { n.n = i + 1; });
        drag.index = want;
        render();          // ridisegna solo quando si cambia corsia
      } else {
        applyDrag();       // dentro la corsia basta spostare il punto
      }
      return;
    }
    if (roaming) { roamTo(evt); return; }
    if (pan) {
      view.tx = pan.tx + (evt.clientX - pan.x);
      view.ty = pan.ty + (evt.clientY - pan.y);
      applyView();
    }
  });

  function endPan() {
    wrap.classList.remove("panning");
    pan = null;
    roaming = false;
    // Spostare la vista non fa parlare nessuno, quindi un render messo da
    // parte durante il gesto è ancora l'ultima notizia che abbiamo.
    if (pending) { accept(pending); pending = null; }
  }

  // Il rilascio dice cosa voleva dire il gesto. Fermo era un click sul brano;
  // spostato in un'altra corsia è un ordine nuovo, e lo si manda a Python —
  // che rifà la playlist e ridisegna. Spostato e rimesso dov'era non è
  // successo niente, e non si disturba nessuno.
  function endDrag() {
    if (!drag) return;
    var was = drag, moved = drag.moved && drag.index !== drag.from;
    drag = null;
    wrap.classList.remove("dragging");
    render();
    if (!was.moved) sendValue({ type: "click", id: was.id });
    else if (moved) sendValue({ type: "move", id: was.id, to: was.index });
    else if (pending) { accept(pending); pending = null; }
  }

  svg.addEventListener("pointerup", function (evt) {
    if (drag) { endDrag(); return; }
    endPan(evt);
  });
  svg.addEventListener("pointercancel", function (evt) {
    if (drag) { endDrag(); return; }
    endPan(evt);
  });

  function zoomAt(factor, cx, cy) {
    var next = clamp(view.z * factor, MIN_Z, MAX_Z);
    var k = next / view.z;
    // Il punto sotto il cursore resta dov'è: si ingrandisce quello che si
    // sta guardando, non il centro della lavagna.
    view.tx = cx - (cx - view.tx) * k;
    view.ty = cy - (cy - view.ty) * k;
    view.z = next;
    applyView();
  }

  svg.addEventListener("wheel", function (evt) {
    evt.preventDefault();
    hideTip();
    var p = svgPoint(evt);
    zoomAt(evt.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
  }, { passive: false });

  document.getElementById("zin").addEventListener("click", function () {
    zoomAt(1.25, W / 2, H / 2);
  });
  document.getElementById("zout").addEventListener("click", function () {
    zoomAt(1 / 1.25, W / 2, H / 2);
  });
  document.getElementById("zfit").addEventListener("click", fitAll);
  document.getElementById("zfull").addEventListener("click", function () {
    // Streamlit concede `fullscreen` al riquadro, quindi si chiede a tutto
    // schermo il contenitore e non il documento: lo sfondo, il cartellino e
    // la mappina devono venire con la lavagna.
    if (document.fullscreenElement) document.exitFullscreen();
    else if (wrap.requestFullscreen) wrap.requestFullscreen();
  });

  function accept(data) {
    var args = data.args || {};
    state.nodes = args.nodes || [];
    state.ticks = args.ticks || [];
    state.selected = args.selected || null;
    state.dark = !!args.dark;
    render();
    setHeight();
  }

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    // Col dito ancora giù non si ricostruisce niente: Streamlit rimanda le
    // sue proprietà a ogni giro di pagina, e un giro qualsiasi può capitare
    // a metà di uno spostamento della vista.
    if (pan || roaming || drag) { pending = data; return; }
    accept(data);
  });

  // Restringendo la finestra cambia la larghezza della colonna, quindi anche
  // l'altezza del disegno: senza riascoltarla il riquadro resterebbe alto
  // quanto era al primo giro.
  if (window.ResizeObserver) {
    new ResizeObserver(function () { setHeight(); }).observe(svg);
  }
  document.addEventListener("fullscreenchange", function () {
    // Tornando dallo schermo intero il disegno ritrova la sua larghezza, e
    // il riquadro deve ritrovare la sua altezza.
    render();
    setHeight();
  });

  toParent({ type: "streamlit:componentReady", apiVersion: 1 });
  setHeight();
  render();
})();
</script>
</body>
</html>
