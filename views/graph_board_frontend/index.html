<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  #wrap { position: relative; }
  svg { display: block; width: 100%; touch-action: none; user-select: none; }
  #wrap.panning svg { cursor: grabbing; }
  .node { cursor: grab; }
  .node.dragging { cursor: grabbing; }
  .card-text {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    pointer-events: none;
  }
  .trash { cursor: pointer; }
  #zoom {
    position: absolute; left: 10px; bottom: 10px;
    display: flex; flex-direction: column; gap: 4px;
  }
  #zoom button {
    width: 26px; height: 26px; padding: 0; line-height: 1;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  /* A tutto schermo il riquadro non è più alto quanto la sua proporzione ma
     quanto lo schermo, e la lavagna ci si adagia dentro senza deformarsi. */
  #wrap:fullscreen { display: flex; align-items: center; justify-content: center; }
  #wrap:fullscreen svg { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="board"></svg>
  <div id="zoom">
    <button id="zin" title="Zoom in">+</button>
    <button id="zout" title="Zoom out">−</button>
    <button id="zfit" title="Fit the board">⤢</button>
    <button id="zfull" title="Full screen">⛶</button>
  </div>
</div>
<script>
(function () {
  "use strict";

  var W = 1100, H = 520;
  // Il nodo è una scheda, non un pallino: djoid mostra copertina, titolo e
  // i numeri su cui si decide un mix, e senza quei numeri il grafo va
  // riletto altrove per capirlo.
  var CARD_W = 108, ART_H = 84, BODY_H = 70, CARD_H = ART_H + BODY_H;
  var MIN_Z = 0.35, MAX_Z = 2.6;

  var svg = document.getElementById("board");
  var wrap = document.getElementById("wrap");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);

  // La mappina in basso a destra: dove sta ogni scheda su tutta la lavagna, e
  // il rettangolo di quanto se ne sta guardando. Serve appena si zooma, che è
  // il momento in cui si perde il resto di vista.
  var MAP_W = 170, MAP_H = 88;
  var MAP_X = W - MAP_W - 12, MAP_Y = H - MAP_H - 12;

  var state = { nodes: [], links: [], selected: null, dark: false };
  var view = { z: 1, tx: 0, ty: 0 };
  var drag = null;    // trascinamento di un nodo
  var pan = null;     // trascinamento dello sfondo
  var roaming = false; // trascinamento dentro la mappina
  var scene = null, edgeGroup = null, minimap = null, skin = null;

  // `isStreamlitMessage` non è decorazione: Streamlit scarta senza guardare
  // ogni messaggio che non ce l'ha. Senza, il riquadro resta alto zero e non
  // gli arriva mai il primo render, perché non è mai risultato pronto.
  function toParent(msg) {
    window.parent.postMessage(
      Object.assign({ isStreamlitMessage: true }, msg), "*");
  }

  // L'altezza da chiedere è quella che il disegno occupa DAVVERO, non quella
  // del viewBox. L'SVG è largo quanto la colonna e tiene la sua proporzione,
  // quindi sotto i millecento pixel è più basso di 520 — chiederne 520 lascia
  // una fascia vuota sotto la lavagna, che su una pagina stretta è la maggior
  // parte del riquadro. Si misura dopo che il browser ha impaginato.
  function setHeight() {
    if (document.fullscreenElement) return;   // lì l'altezza è lo schermo
    var drawn = Math.round(svg.getBoundingClientRect().height);
    toParent({ type: "streamlit:setFrameHeight", height: (drawn || H) + 12 });
  }

  // Ogni evento porta l'istante in cui è successo. Streamlit ridà a Python
  // l'ultimo valore del componente a OGNI rerun, non solo quando cambia: un
  // click senza un modo di riconoscerlo come già visto verrebbe rieseguito
  // per sempre, perché la risposta a un click è un rerun. Il momento serve
  // e non un contatore, perché il riquadro può essere ricreato da capo e un
  // contatore ripartirebbe da zero.
  function sendValue(value) {
    value.at = Date.now();
    toParent({ type: "streamlit:setComponentValue", value: value, dataType: "json" });
  }

  function svgPoint(evt) {
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    var ctm = svg.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    return pt.matrixTransform(ctm.inverse());
  }

  // Il punto sotto il mouse in coordinate della scena, cioè al netto di
  // zoom e spostamento: è lì che stanno i nodi.
  function scenePoint(evt) {
    var p = svgPoint(evt);
    return { x: (p.x - view.tx) / view.z, y: (p.y - view.ty) / view.z };
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function nodeById(id) {
    for (var i = 0; i < state.nodes.length; i++) {
      if (state.nodes[i].id === id) return state.nodes[i];
    }
    return null;
  }

  function el(tag, attrs) {
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function text(str, attrs) {
    var t = el("text", Object.assign({ class: "card-text" }, attrs));
    t.textContent = str == null ? "" : String(str);
    return t;
  }

  // -- geometria ---------------------------------------------------------

  // Le posizioni salvate sono il CENTRO della scheda: la scheda si disegna
  // attorno, e gli agganci stanno sui fianchi all'altezza in cui finisce la
  // copertina, come in djoid.
  function corner(n) {
    return { x: n.x * W - CARD_W / 2, y: n.y * H - CARD_H / 2 };
  }

  function anchors(n) {
    var c = corner(n);
    return { left: { x: c.x, y: c.y + ART_H }, right: { x: c.x + CARD_W, y: c.y + ART_H } };
  }

  // Curva orizzontale fra il fianco destro di chi sta a sinistra e il
  // fianco sinistro dell'altro. I punti di controllo sono orizzontali, non
  // perpendicolari: è quello che rende la linea "morbida" invece di
  // gonfiarla in un arco quando i due nodi sono su altezze diverse.
  function edgePath(a, b) {
    var left = a, right = b;
    if (corner(a).x > corner(b).x) { left = b; right = a; }
    var s = anchors(left).right, e = anchors(right).left;
    var bend = Math.max(30, Math.abs(e.x - s.x) * 0.45);
    return "M " + s.x + " " + s.y +
           " C " + (s.x + bend) + " " + s.y + ", " +
                   (e.x - bend) + " " + e.y + ", " + e.x + " " + e.y;
  }

  function applyView() {
    if (scene) {
      scene.setAttribute("transform",
        "translate(" + view.tx + "," + view.ty + ") scale(" + view.z + ")");
    }
    drawMinimap();
  }

  // Quale porzione della lavagna sta nel riquadro, in frazioni di lavagna.
  function seen() {
    return { x0: -view.tx / (view.z * W), x1: (W - view.tx) / (view.z * W),
             y0: -view.ty / (view.z * H), y1: (H - view.ty) / (view.z * H) };
  }

  function centreOn(nx, ny) {
    view.tx = W / 2 - view.z * nx * W;
    view.ty = H / 2 - view.z * ny * H;
    applyView();
  }

  function drawMinimap() {
    if (!minimap || !skin) return;
    while (minimap.firstChild) minimap.removeChild(minimap.firstChild);
    minimap.appendChild(el("rect", {
      x: MAP_X, y: MAP_Y, width: MAP_W, height: MAP_H, rx: 6,
      fill: skin.card, "fill-opacity": 0.94,
      stroke: skin.ink, "stroke-opacity": 0.25 }));

    var box = seen();
    var x0 = clamp(box.x0, 0, 1), x1 = clamp(box.x1, 0, 1);
    var y0 = clamp(box.y0, 0, 1), y1 = clamp(box.y1, 0, 1);
    minimap.appendChild(el("rect", {
      x: MAP_X + x0 * MAP_W, y: MAP_Y + y0 * MAP_H,
      width: Math.max(3, (x1 - x0) * MAP_W),
      height: Math.max(3, (y1 - y0) * MAP_H),
      fill: skin.ink, "fill-opacity": 0.08,
      stroke: skin.ink, "stroke-opacity": 0.5, rx: 2 }));

    state.nodes.forEach(function (n) {
      minimap.appendChild(el("rect", {
        x: MAP_X + n.x * MAP_W - 3, y: MAP_Y + n.y * MAP_H - 2.5,
        width: 6, height: 5, rx: 1.5, fill: n.color,
        "fill-opacity": n.id === state.selected ? 1 : 0.7 }));
    });
  }

  // -- disegno -----------------------------------------------------------

  // Il nome arriva già accorciato, ma su una misura di caratteri, e la
  // scheda ha una larghezza in pixel: quanto ci sta lo sa solo chi la
  // disegna, o il titolo esce dal riquadro.
  function fit(str, most) {
    str = String(str == null ? "" : str);
    return str.length <= most ? str : str.slice(0, most - 1) + "…";
  }

  function chip(label, fill, ink) {
    var g = el("g", {});
    var w = 7 * String(label).length + 10;
    g.appendChild(el("rect", { x: 0, y: 0, width: w, height: 14, rx: 4, fill: fill }));
    g.appendChild(text(label, { x: w / 2, y: 10.5, "text-anchor": "middle",
                                "font-size": 9, "font-weight": 600, fill: ink }));
    g.dataset.width = w;
    return g;
  }

  function drawCard(n, sel, skin) {
    var c = corner(n);
    var g = el("g", { class: "node", "data-id": n.id });
    // Il selezionato si stacca dagli altri ingrandendosi e alzandosi, non
    // con un anello attorno: è così che si distingue a colpo d'occhio in
    // una fila di schede tutte uguali.
    var lift = sel ? "translate(" + (c.x + CARD_W / 2) + "," + (c.y + CARD_H / 2 - 8) + ") " +
                     "scale(1.12) translate(" + (-CARD_W / 2) + "," + (-CARD_H / 2) + ")"
                   : "translate(" + c.x + "," + c.y + ")";
    g.setAttribute("transform", lift);

    if (sel) {
      g.appendChild(el("rect", { x: -3, y: -3, width: CARD_W + 6, height: CARD_H + 6,
                                 rx: 9, fill: "none", stroke: skin.ink,
                                 "stroke-opacity": 0.85, "stroke-width": 1.5 }));
    }
    g.appendChild(el("rect", { x: 0, y: 0, width: CARD_W, height: CARD_H, rx: 7,
                               fill: skin.card }));
    // Niente copertine nella libreria: al posto dell'artwork il blocco di
    // colore del genere, che è la stessa codifica della mappa qui sopra.
    g.appendChild(el("path", {
      d: "M 7 0 H " + (CARD_W - 7) + " A 7 7 0 0 1 " + CARD_W + " 7 V " + ART_H +
         " H 0 V 7 A 7 7 0 0 1 7 0 Z", fill: n.color }));

    g.appendChild(text(fit(n.label, 15), { x: 8, y: ART_H + 15, "font-size": 10.5,
                                           "font-weight": 700, fill: skin.ink }));

    // Due righe che condividono le colonne: sopra i valori, sotto come si
    // muovono rispetto alla scheda prima di questa nella scaletta. Le celle
    // le posiziona un giro solo, o le due righe si disallineerebbero appena
    // a un brano manca un dato.
    var values = el("g", { transform: "translate(8," + (ART_H + 21) + ")" });
    var shifts = el("g", { transform: "translate(8," + (ART_H + 46) + ")" });
    var at = 0;

    var shift = n.shift || {};

    function column(cell, width, moved) {
      cell.setAttribute("transform", "translate(" + at + ",0)");
      values.appendChild(cell);
      if (moved) {
        shifts.appendChild(text(moved[0], {
          x: at, y: 0, "font-size": 8.5, "font-weight": 600,
          fill: wayInk(moved[1], skin) }));
      }
      at += width + 4;
    }

    if (n.bpm) {
      var tempo = el("g", {});
      tempo.appendChild(text(n.bpm, { x: 0, y: 10.5, "font-size": 9,
                                      fill: skin.dim }));
      column(tempo, 7 * String(n.bpm).length + 2, shift.bpm);
    }
    if (n.camelot) {
      var k = chip(n.camelot, n.keyColor, "#1b1f27");
      column(k, Number(k.dataset.width), shift.key);
    }
    if (n.dance) {
      var d = chip(n.dance, driveFill(n.drive, skin), skin.ink);
      column(d, Number(d.dataset.width), shift.dance);
    }
    g.appendChild(values);
    g.appendChild(shifts);

    if (n.genre) {
      var genre = fit(n.genre, 19);
      var gw = Math.min(CARD_W - 16, 4.6 * genre.length + 12);
      var pill = el("g", { transform: "translate(8," + (ART_H + 52) + ")" });
      pill.appendChild(el("rect", { x: 0, y: 0, width: gw, height: 12, rx: 6,
                                    fill: skin.chip }));
      pill.appendChild(text(genre, { x: gw / 2, y: 9, "text-anchor": "middle",
                                     "font-size": 8, fill: skin.dim }));
      g.appendChild(pill);
    }

    [anchors(n).left, anchors(n).right].forEach(function (a) {
      var local = sel
        ? { x: (a.x - c.x - CARD_W / 2) / 1.12 + CARD_W / 2,
            y: (a.y - c.y - CARD_H / 2) / 1.12 + CARD_H / 2 }
        : { x: a.x - c.x, y: a.y - c.y };
      g.appendChild(el("circle", { cx: local.x, cy: local.y, r: 3,
                                   fill: skin.paper, stroke: skin.ink,
                                   "stroke-opacity": 0.6, "stroke-width": 1.2 }));
    });

    if (sel) {
      var trash = el("g", { class: "trash",
                            transform: "translate(" + (CARD_W / 2) + "," + (CARD_H + 16) + ")" });
      trash.appendChild(el("circle", { r: 10, fill: skin.card, stroke: skin.ink,
                                       "stroke-opacity": 0.35 }));
      trash.appendChild(el("path", {
        d: "M -4 -3 H 4 M -3 -3 V 4 H 3 V -3 M -1.5 -3 V -5 H 1.5 V -3",
        fill: "none", stroke: skin.danger, "stroke-width": 1.3,
        "stroke-linecap": "round", "stroke-linejoin": "round" }));
      trash.addEventListener("pointerdown", function (evt) {
        evt.stopPropagation();
        sendValue({ type: "remove", id: n.id });
      });
      g.appendChild(trash);
    }

    g.addEventListener("pointerdown", function (evt) {
      evt.stopPropagation();
      drag = { id: n.id, moved: false, group: g };
      g.setPointerCapture(evt.pointerId);
      g.classList.add("dragging");
    });
    return g;
  }

  function skinOf() {
    return state.dark
      ? { ink: "#eef1f6", dim: "rgba(238,241,246,0.55)", paper: "#0e1117",
          card: "#1b1f27", chip: "rgba(238,241,246,0.10)",
          faint: "rgba(238,241,246,0.16)", danger: "#e0503b",
          // Caldo sale, freddo scende. Non verde e rosso: salire non è
          // giusto e scendere non è un errore — un set fa entrambe le cose.
          rise: "#e0a260", fall: "#7fb4e0",
          tone: [238, 241, 246], top: 0.26 }
      : { ink: "#1b1f27", dim: "rgba(27,31,39,0.55)", paper: "#ffffff",
          card: "#f4f6f9", chip: "rgba(27,31,39,0.07)",
          faint: "rgba(27,31,39,0.14)", danger: "#c0392b",
          rise: "#a8600f", fall: "#25689e",
          tone: [27, 31, 39], top: 0.34 };
  }

  // La danceability tinge il suo chip invece di stare in un grigio fisso:
  // scorrendo la catena si vede dove il ritmo si irrigidisce senza leggere
  // i decimali. Senza tinta propria, però — il colore lo dà l'inchiostro del
  // tema, più o meno carico: due chip vicini con due tinte diverse
  // litigherebbero con la ruota Camelot, che di tinte vive.
  function driveFill(drive, skin) {
    if (drive === null || drive === undefined) return skin.chip;
    var alpha = 0.06 + (skin.top - 0.06) * drive;
    return "rgba(" + skin.tone.join(",") + "," + alpha.toFixed(3) + ")";
  }

  function wayInk(way, skin) {
    return way > 0 ? skin.rise : (way < 0 ? skin.fall : skin.dim);
  }

  function render() {
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    skin = skinOf();
    // A tutto schermo il riquadro deborda dalla lavagna: senza un fondo suo
    // resterebbe il bianco del browser attorno.
    wrap.style.background = skin.paper;

    var defs = el("defs", {});
    var pattern = el("pattern", { id: "dots", width: 26, height: 26,
                                  patternUnits: "userSpaceOnUse" });
    pattern.appendChild(el("circle", { cx: 2, cy: 2, r: 1.1, fill: skin.faint }));
    defs.appendChild(pattern);
    svg.appendChild(defs);
    svg.appendChild(el("rect", { x: 0, y: 0, width: W, height: H, fill: skin.paper }));

    scene = el("g", {});
    // I puntini stanno DENTRO la scena e ne debordano: spostandola si trova
    // ancora fondo, invece di scoprire il bianco fuori dal riquadro.
    scene.appendChild(el("rect", { x: -2 * W, y: -2 * H, width: 5 * W, height: 5 * H,
                                   fill: "url(#dots)" }));

    edgeGroup = el("g", { stroke: skin.ink, "stroke-opacity": 0.35,
                          "stroke-width": 1.6, fill: "none" });
    state.links.forEach(function (link) {
      var a = nodeById(link.a), b = nodeById(link.b);
      if (!a || !b) return;
      edgeGroup.appendChild(el("path", { d: edgePath(a, b), "data-a": link.a,
                                         "data-b": link.b }));
    });
    scene.appendChild(edgeGroup);

    // Il selezionato per ultimo, così sta sopra ai vicini che sfiora.
    state.nodes.forEach(function (n) {
      if (n.id !== state.selected) scene.appendChild(drawCard(n, false, skin));
    });
    var sel = nodeById(state.selected);
    if (sel) scene.appendChild(drawCard(sel, true, skin));

    svg.appendChild(scene);

    // Fuori dalla scena: la mappina non si sposta né si ingrandisce con
    // quello che racconta.
    minimap = el("g", { id: "minimap" });
    svg.appendChild(minimap);
    applyView();
  }

  // Durante il trascinamento si ridisegna solo quel che si muove: rifare
  // l'intera scena a ogni pixel significa ricostruire dieci elementi per
  // scheda, e sotto il dito si sente.
  function redrawDragged() {
    var n = nodeById(drag.id);
    var c = corner(n);
    var sel = n.id === state.selected;
    drag.group.setAttribute("transform", sel
      ? "translate(" + (c.x + CARD_W / 2) + "," + (c.y + CARD_H / 2 - 8) + ") " +
        "scale(1.12) translate(" + (-CARD_W / 2) + "," + (-CARD_H / 2) + ")"
      : "translate(" + c.x + "," + c.y + ")");
    Array.prototype.forEach.call(edgeGroup.childNodes, function (path) {
      var a = path.getAttribute("data-a"), b = path.getAttribute("data-b");
      if (a === n.id || b === n.id) {
        path.setAttribute("d", edgePath(nodeById(a), nodeById(b)));
      }
    });
  }

  // -- mouse -------------------------------------------------------------

  function inMinimap(evt) {
    var p = svgPoint(evt);
    return p.x >= MAP_X && p.x <= MAP_X + MAP_W
        && p.y >= MAP_Y && p.y <= MAP_Y + MAP_H;
  }

  function roamTo(evt) {
    var p = svgPoint(evt);
    centreOn(clamp((p.x - MAP_X) / MAP_W, 0, 1),
             clamp((p.y - MAP_Y) / MAP_H, 0, 1));
  }

  svg.addEventListener("pointerdown", function (evt) {
    if (drag) return;
    // Premere sulla mappina porta lo sguardo lì invece di trascinare la
    // lavagna sotto: è una cartina, non una parte del foglio.
    if (inMinimap(evt)) {
      roaming = true;
      svg.setPointerCapture(evt.pointerId);
      roamTo(evt);
      return;
    }
    pan = { x: evt.clientX, y: evt.clientY, tx: view.tx, ty: view.ty };
    wrap.classList.add("panning");
    svg.setPointerCapture(evt.pointerId);
  });

  svg.addEventListener("pointermove", function (evt) {
    if (roaming) { roamTo(evt); return; }
    if (drag) {
      var n = nodeById(drag.id);
      if (!n) return;
      var p = scenePoint(evt);
      n.x = clamp(p.x / W, 0.02, 0.98);
      n.y = clamp(p.y / H, 0.02, 0.98);
      drag.moved = true;
      redrawDragged();
    } else if (pan) {
      view.tx = pan.tx + (evt.clientX - pan.x);
      view.ty = pan.ty + (evt.clientY - pan.y);
      applyView();
    }
  });

  function endDrag() {
    wrap.classList.remove("panning");
    pan = null;
    roaming = false;
    if (!drag) return;
    var n = nodeById(drag.id);
    drag.group.classList.remove("dragging");
    if (n) {
      // Premere e rilasciare senza spostare è una scelta, non uno
      // spostamento da zero pixel: sono i due gesti dello stesso tasto.
      if (drag.moved) sendValue({ type: "move", id: n.id, x: n.x, y: n.y });
      else sendValue({ type: "click", id: n.id });
    }
    drag = null;
  }

  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);

  function zoomAt(factor, cx, cy) {
    var next = clamp(view.z * factor, MIN_Z, MAX_Z);
    var k = next / view.z;
    // Il punto sotto il cursore resta dov'è: si ingrandisce quello che si
    // sta guardando, non il centro della lavagna.
    view.tx = cx - (cx - view.tx) * k;
    view.ty = cy - (cy - view.ty) * k;
    view.z = next;
    applyView();
  }

  svg.addEventListener("wheel", function (evt) {
    evt.preventDefault();
    var p = svgPoint(evt);
    zoomAt(evt.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
  }, { passive: false });

  document.getElementById("zin").addEventListener("click", function () {
    zoomAt(1.25, W / 2, H / 2);
  });
  document.getElementById("zout").addEventListener("click", function () {
    zoomAt(1 / 1.25, W / 2, H / 2);
  });
  document.getElementById("zfit").addEventListener("click", function () {
    view = { z: 1, tx: 0, ty: 0 };
    applyView();
  });
  document.getElementById("zfull").addEventListener("click", function () {
    // Streamlit concede `fullscreen` al riquadro, quindi si chiede a tutto
    // schermo il contenitore e non il documento: lo sfondo e la mappina
    // devono venire con la lavagna.
    if (document.fullscreenElement) document.exitFullscreen();
    else if (wrap.requestFullscreen) wrap.requestFullscreen();
  });

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type !== "streamlit:render") return;
    var args = data.args || {};
    state.nodes = args.nodes || [];
    state.links = args.links || [];
    state.selected = args.selected || null;
    state.dark = !!args.dark;
    render();
    setHeight();
  });

  // Restringendo la finestra cambia la larghezza della colonna, quindi anche
  // l'altezza del disegno: senza riascoltarla il riquadro resterebbe alto
  // quanto era al primo giro.
  if (window.ResizeObserver) {
    new ResizeObserver(function () { setHeight(); }).observe(svg);
  }
  document.addEventListener("fullscreenchange", function () {
    // Tornando dallo schermo intero il disegno ritrova la sua larghezza, e
    // il riquadro deve ritrovare la sua altezza.
    render();
    setHeight();
  });

  toParent({ type: "streamlit:componentReady", apiVersion: 1 });
  setHeight();
  render();
})();
</script>
</body>
</html>
