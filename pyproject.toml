[tool.poetry]
name = "dj-library-tools"
version = "0.1.0"
description = "Analisi di una libreria mp3 per DJing: classificazione genere/vibe e phrase boundary suggerite per il posizionamento manuale degli hot cue."
authors = ["Maurizio Spadaccino <mspadaccino@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
mutagen = "^1.47"
librosa = "^0.10"
numpy = ">=1.26"
streamlit = "^1.37"
plotly = "^5.22"
demucs = "^4.0"

# Essentia sta a parte: pesa 424 MB (TensorFlow e' dentro il pacchetto) e su
# PyPI esiste solo come pre-release, quindi un vincolo tipo ">=2.1b6" NON la
# troverebbe. Serve solo alla sezione "Tag analysis", che senza degrada da
# sola:  poetry install --with essentia
[tool.poetry.group.essentia]
optional = true

[tool.poetry.group.essentia.dependencies]
essentia-tensorflow = { version = "*", allow-prereleases = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
